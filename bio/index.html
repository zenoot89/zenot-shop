<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zenoot — Sweater Rajut & Knitwear Bandung | Cardigan, Turtleneck</title>
<meta name="description" content="zenoot — produsen sweater rajut & knitwear Bandung. Cardigan, turtleneck, half zip, polo rajut pria & wanita. Grosir & eceran, dirajut di sentra rajut Binong Jati.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zenoot.web.id/bio/">
<meta property="og:title" content="zenoot — Sweater Rajut & Knitwear Bandung">
<meta property="og:description" content="Cardigan, turtleneck, half zip, polo rajut pria & wanita. Grosir & eceran, dirajut di sentra rajut Binong Jati.">
<meta property="og:image" content="https://zenoot.web.id/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zenoot.web.id/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --dasar:#8A8580;--muda:#F0EFEB;--tua:#2B2B2B;--putih:#fff;
    --border:#00000014;--text:#242220;--muted:#e7e4de;--sec:#4a4640;
    --radius:12px;--radius-sm:8px;--green:#25D366;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--dasar);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 18px 48px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .page{width:100%;max-width:420px;}
  header{text-align:center;margin-bottom:24px;background:var(--muda);border-radius:16px;padding:24px 18px;}
  .logo{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;color:var(--tua);}
  .tagline{font-size:14px;color:var(--sec);margin:0;line-height:1.55;}

  nav{display:flex;flex-direction:column;gap:12px;}

  a.card,button.card{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);
    text-decoration:none;color:var(--text);background:var(--muda);border:none;width:100%;
    font-family:'Inter',sans-serif;cursor:pointer;text-align:left;
    box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover,button.card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.14);}
  a.card:focus-visible,button.card:focus-visible{outline:2px solid var(--tua);outline-offset:2px;}

  .card.primary{background:var(--tua);color:#fff;}
  .card.primary .icon{background:rgba(255,255,255,.16);color:#fff;}
  .card.primary .sub{color:rgba(255,255,255,.65);}
  .card.primary .chev{color:rgba(255,255,255,.6);}

  .icon{flex:0 0 auto;width:38px;height:38px;border-radius:var(--radius-sm);background:var(--dasar);color:#fff;display:flex;align-items:center;justify-content:center;}
  .icon.wa{background:#DCF8C6;color:#128C7E;}
  .icon svg{display:block;}
  .txt{flex:1;min-width:0;}
  .label{font-weight:600;font-size:15px;margin:0 0 2px;}
  .sub{font-size:12.5px;color:var(--sec);margin:0;}
  .chev{flex:0 0 auto;color:var(--sec);font-size:15px;transition:transform .2s;}
  .chev.open{transform:rotate(90deg);}

  .submenu{max-height:0;overflow:hidden;transition:max-height .2s ease;display:flex;flex-direction:column;gap:6px;padding-left:8px;}
  .submenu.open{max-height:280px;margin-top:2px;}
  .submenu a.card{padding:9px 14px;box-shadow:none;border:none;background:var(--putih);}
  .submenu a.card:hover{transform:none;box-shadow:none;background:var(--border);}
  .submenu .badge{flex:0 0 auto;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;}
  .submenu .label{font-size:13.5px;}
  .submenu .chev{font-size:13px;}

  .social{display:flex;justify-content:center;gap:12px;margin-top:28px;}
  .social a{width:42px;height:42px;border-radius:50%;background:var(--muda);display:flex;align-items:center;justify-content:center;color:var(--tua);text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .15s ease, color .15s ease;}
  .social a:hover{background:var(--tua);color:#fff;}

  footer{text-align:center;margin-top:26px;}
  footer p{font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--text);margin:0;}
  footer a{color:var(--text);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  .skel{opacity:.5;}
</style>
</head>
<body>
  <div class="page">
    <header>
      <p class="logo">zenoot</p>
      <p class="tagline">Sweater rajut &amp; knitwear pria/wanita.<br>Grosir &amp; eceran, dirajut di Bandung.</p>
    </header>

    <nav id="linksNav" class="skel">
      <p style="text-align:center;color:var(--putih);font-size:13px">Memuat...</p>
    </nav>

    <div class="social" id="socialRow"></div>

    <footer><p><a href="https://zenoot.web.id">zenoot.web.id</a></p></footer>
  </div>

<script>
const SUPABASE_URL = 'https://xvaxwxnvjzrazxgdxsrt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2YXh3eG52anpyYXp4Z2R4c3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk4OTQsImV4cCI6MjEwMTM2NTg5NH0.JbL_0Q_zq0LGLnKIro8wzpvPvRxMj3OqWZTxYUYAj5o';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ICONS = {
  bag: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  cart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.6a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 8H6"/></svg>',
  pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.7-.8L3 20l1-4.8A8.4 8.4 0 1 1 21 11.5z"/></svg>'
};

const SOCIAL_ICONS = {
  ig: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
  tiktok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3c.3 2 1.7 3.6 4 3.9v2.6c-1.4 0-2.8-.4-4-1.2v6.4a5.3 5.3 0 1 1-5.3-5.3c.3 0 .6 0 .9.1v2.7a2.6 2.6 0 1 0 1.8 2.5V3h2.6z"/></svg>',
  shopee: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>'
};

function normalizeUrl(u){
  if (!u) return null;
  u = u.trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function waLink(number){
  const digits = (number || '').replace(/[^0-9]/g,'');
  return digits ? `https://wa.me/${digits}` : null;
}

function cardHTML({icon, label, sub, href, primary, id, iconClass}){
  return `<a class="card${primary?' primary':''}" href="${href}" target="_blank" rel="noopener" ${id?`id="${id}"`:''}>
    <span class="icon${iconClass?' '+iconClass:''}">${icon}</span>
    <span class="txt"><p class="label">${label}</p><p class="sub">${sub}</p></span>
    <span class="chev">›</span>
  </a>`;
}

async function render(){
  const { data, error } = await sb.from('bio_links').select('*').eq('id', 1).maybeSingle();
  const nav = document.getElementById('linksNav');
  const social = document.getElementById('socialRow');
  nav.classList.remove('skel');

  if (error || !data){
    nav.innerHTML = `<p style="text-align:center;color:var(--putih);font-size:13px">Link belum tersedia.</p>`;
    return;
  }

  let html = '';

  // 1. Belanja di Web
  if (data.web_url){
    html += cardHTML({icon:ICONS.bag, label:'Belanja di zenoot.web.id', sub:'Katalog lengkap & harga grosir', href:normalizeUrl(data.web_url), primary:true});
  }

  // 2. Marketplace (expandable)
  const mp = [
    data.shopee_url ? {label:'Shopee', href:normalizeUrl(data.shopee_url), color:'#ee4d2d', letter:'S'} : null,
    data.tiktokshop_url ? {label:'TikTok Shop', href:normalizeUrl(data.tiktokshop_url), color:'#000000', letter:'T'} : null,
    data.lazada_url ? {label:'Lazada', href:normalizeUrl(data.lazada_url), color:'#0F146D', letter:'L'} : null,
  ].filter(Boolean);
  if (mp.length){
    html += `<button class="card" onclick="toggleMarketplace()">
      <span class="icon">${ICONS.cart}</span>
      <span class="txt"><p class="label">Marketplace</p><p class="sub">${mp.map(m=>m.label).join(' · ')}</p></span>
      <span class="chev" id="mpChevron">›</span>
    </button>
    <div class="submenu" id="mpSubmenu">
      ${mp.map(m=>`<a class="card" href="${m.href}" target="_blank" rel="noopener"><span class="badge" style="background:${m.color}">${m.letter}</span><span class="txt"><p class="label">${m.label}</p></span><span class="chev">↗</span></a>`).join('')}
    </div>`;
  }

  // 3. Toko offline Bandung
  if (data.maps_url || data.alamat_text){
    html += cardHTML({icon:ICONS.pin, label:'Kunjungi Toko Bandung', sub:data.alamat_text || 'Lihat lokasi', href:normalizeUrl(data.maps_url) || '#'});
  }

  // 4. WhatsApp
  const wa = waLink(data.wa_number);
  if (wa){
    html += cardHTML({icon:ICONS.chat, label:'Chat & Pesan via WhatsApp', sub:'Tanya stok, ukuran, atau custom', href:wa, iconClass:'wa'});
  }

  nav.innerHTML = html || `<p style="text-align:center;color:var(--putih);font-size:13px">Link belum tersedia.</p>`;

  // 5. Sosial media
  let socialHtml = '';
  if (data.ig_url) socialHtml += `<a href="${normalizeUrl(data.ig_url)}" target="_blank" rel="noopener" aria-label="Instagram">${SOCIAL_ICONS.ig}</a>`;
  if (data.tiktok_url) socialHtml += `<a href="${normalizeUrl(data.tiktok_url)}" target="_blank" rel="noopener" aria-label="TikTok">${SOCIAL_ICONS.tiktok}</a>`;
  if (data.shopee_url) socialHtml += `<a href="${normalizeUrl(data.shopee_url)}" target="_blank" rel="noopener" aria-label="Shopee">${SOCIAL_ICONS.shopee}</a>`;
  social.innerHTML = socialHtml;
}

function toggleMarketplace(){
  document.getElementById('mpSubmenu').classList.toggle('open');
  document.getElementById('mpChevron').classList.toggle('open');
}

render();
</script>
</body>
</html>
