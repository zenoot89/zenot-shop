<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zenoot — Sweater Rajut & Knitwear Bandung | Cardigan, Turtleneck</title>
<meta name="description" content="zenoot — produsen sweater rajut & knitwear Bandung. Cardigan, turtleneck, half zip, polo rajut pria & wanita. Grosir & eceran, dirajut di sentra rajut Binong Jati.">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f5f4f2;--surface:#fff;--border:#e0ddd8;--sep:#b5a898;
    --text:#1a1a1a;--muted:#9e9890;--sec:#6b6560;
    --accent:#1a1a1a;--radius:12px;--radius-sm:8px;
    --green:#25D366;--ink:#1a1a1a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 18px 48px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .page{width:100%;max-width:420px;}
  header{text-align:center;margin-bottom:32px;}
  .logo{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
  .tagline{font-size:14px;color:var(--sec);margin:0;line-height:1.55;}

  nav{display:flex;flex-direction:column;gap:12px;}

  a.card,button.card{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);
    text-decoration:none;color:var(--text);background:var(--surface);border:none;width:100%;
    font-family:'Inter',sans-serif;cursor:pointer;text-align:left;
    box-shadow:0 1px 2px rgba(26,26,26,.05);transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover,button.card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,26,26,.08);}
  a.card:focus-visible,button.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .card.primary{background:var(--ink);color:#fff;}
  .card.primary .icon{background:rgba(255,255,255,.14);color:#fff;}
  .card.primary .sub{color:rgba(255,255,255,.65);}
  .card.primary .chev{color:rgba(255,255,255,.6);}

  .icon{flex:0 0 auto;width:38px;height:38px;border-radius:var(--radius-sm);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .txt{flex:1;min-width:0;}
  .label{font-weight:600;font-size:15px;margin:0 0 2px;}
  .sub{font-size:12.5px;color:var(--muted);margin:0;}
  .chev{flex:0 0 auto;color:var(--muted);font-size:15px;transition:transform .2s;}
  .chev.open{transform:rotate(90deg);}

  .submenu{max-height:0;overflow:hidden;transition:max-height .2s ease;display:flex;flex-direction:column;gap:6px;padding-left:8px;}
  .submenu.open{max-height:260px;margin-top:2px;}
  .submenu a.card{padding:9px 14px;box-shadow:none;border:none;background:var(--bg);}
  .submenu a.card:hover{transform:none;box-shadow:none;background:var(--border);}
  .submenu .badge{flex:0 0 auto;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;}
  .submenu .label{font-size:13.5px;}
  .submenu .chev{font-size:13px;}

  .group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 4px 2px;}

  .social{display:flex;justify-content:center;gap:12px;margin-top:32px;}
  .social a{width:42px;height:42px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;box-shadow:0 1px 2px rgba(26,26,26,.05);transition:background .15s ease, color .15s ease;}
  .social a:hover{background:var(--ink);color:#fff;}

  footer{text-align:center;margin-top:26px;}
  footer p{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;}
  footer a{color:var(--sec);text-decoration:underline;}

  .skel{opacity:.4;}
</style>
</head>
<body>
  <div class="page">
    <header>
      <p class="logo">zenoot</p>
      <p class="tagline">Sweater rajut &amp; knitwear pria/wanita.<br>Grosir &amp; eceran, dirajut di Bandung.</p>
    </header>

    <nav id="linksNav" class="skel">
      <p style="text-align:center;color:var(--muted);font-size:13px">Memuat...</p>
    </nav>

    <div class="social" id="socialRow"></div>

    <footer><p><a href="https://zenoot.web.id">ZENOOT.WEB.ID</a></p></footer>
  </div>

<script>
const SUPABASE_URL = 'https://xvaxwxnvjzrazxgdxsrt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2YXh3eG52anpyYXp4Z2R4c3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODk4OTQsImV4cCI6MjEwMTM2NTg5NH0.JbL_0Q_zq0LGLnKIro8wzpvPvRxMj3OqWZTxYUYAj5o';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function normalizeUrl(u){
  if (!u) return null;
  u = u.trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function waLink(number){
  const digits = (number || '').replace(/[^0-9]/g,'');
  return digits ? `https://wa.me/${digits}` : null;
}

function cardHTML({icon, label, sub, href, primary, id}){
  return `<a class="card${primary?' primary':''}" href="${href}" target="_blank" rel="noopener" ${id?`id="${id}"`:''}>
    <span class="icon">${icon}</span>
    <span class="txt"><p class="label">${label}</p><p class="sub">${sub}</p></span>
    <span class="chev">›</span>
  </a>`;
}

async function render(){
  const { data, error } = await sb.from('bio_links').select('*').eq('id', 1).maybeSingle();
  const nav = document.getElementById('linksNav');
  const social = document.getElementById('socialRow');
  nav.classList.remove('skel');

  if (error || !data){
    nav.innerHTML = `<p style="text-align:center;color:var(--muted);font-size:13px">Link belum tersedia.</p>`;
    return;
  }

  let html = '';

  // 1. Belanja di Web
  if (data.web_url){
    html += cardHTML({icon:'🌐', label:'Belanja di zenoot.web.id', sub:'Katalog lengkap & harga grosir', href:normalizeUrl(data.web_url), primary:true});
  }

  // 2. Marketplace (expandable)
  const mp = [
    data.shopee_url ? {label:'Shopee', href:normalizeUrl(data.shopee_url), color:'#ee4d2d', letter:'S'} : null,
    data.tiktokshop_url ? {label:'TikTok Shop', href:normalizeUrl(data.tiktokshop_url), color:'#000000', letter:'T'} : null,
    data.tokopedia_url ? {label:'Tokopedia', href:normalizeUrl(data.tokopedia_url), color:'#03ac0e', letter:'T'} : null,
  ].filter(Boolean);
  if (mp.length){
    html += `<button class="card" onclick="toggleMarketplace()">
      <span class="icon">🛒</span>
      <span class="txt"><p class="label">Marketplace</p><p class="sub">${mp.map(m=>m.label).join(' · ')}</p></span>
      <span class="chev" id="mpChevron">›</span>
    </button>
    <div class="submenu" id="mpSubmenu">
      ${mp.map(m=>`<a class="card" href="${m.href}" target="_blank" rel="noopener"><span class="badge" style="background:${m.color}">${m.letter}</span><span class="txt"><p class="label">${m.label}</p></span><span class="chev">↗</span></a>`).join('')}
    </div>`;
  }

  // 3. Toko offline Bandung
  if (data.maps_url || data.alamat_text){
    html += cardHTML({icon:'📍', label:'Kunjungi Toko Bandung', sub:data.alamat_text || 'Lihat lokasi', href:normalizeUrl(data.maps_url) || '#'});
  }

  // 4. WhatsApp
  const wa = waLink(data.wa_number);
  if (wa){
    html += cardHTML({icon:'💬', label:'Chat & Pesan via WhatsApp', sub:'Tanya stok, ukuran, atau custom', href:wa});
  }

  nav.innerHTML = html || `<p style="text-align:center;color:var(--muted);font-size:13px">Link belum tersedia.</p>`;

  // 5. Sosial media
  let socialHtml = '';
  if (data.ig_url) socialHtml += `<a href="${normalizeUrl(data.ig_url)}" target="_blank" rel="noopener" aria-label="Instagram">IG</a>`;
  if (data.tiktok_url) socialHtml += `<a href="${normalizeUrl(data.tiktok_url)}" target="_blank" rel="noopener" aria-label="TikTok">TT</a>`;
  if (data.shopee_url) socialHtml += `<a href="${normalizeUrl(data.shopee_url)}" target="_blank" rel="noopener" aria-label="Shopee">SP</a>`;
  social.innerHTML = socialHtml;
}

function toggleMarketplace(){
  document.getElementById('mpSubmenu').classList.toggle('open');
  document.getElementById('mpChevron').classList.toggle('open');
}

render();
</script>
</body>
</html>
